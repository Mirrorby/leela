name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      # worker/src/game/rulesetLoader.ts импортирует classic-v1.json НАПРЯМУЮ
      # из src/data/rulesets (единственный источник правды для фронта и
      # воркера, см. worker/src/game/rulesetLoader.ts) — правка одного этого
      # файла без изменений внутри worker/ раньше НЕ триггерила редеплой
      # воркера, из-за чего задеплоенный воркер продолжал играть по старым
      # (забандленным на момент прошлого деплоя) правилам, пока фронтенд уже
      # обновился. Явно перечисляем всё, что воркер импортирует извне своей
      # папки.
      - "src/data/rulesets/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Явно фиксируем версию npm, а не полагаемся на то, что бандлит
      # setup-node сегодня. Причина: package-lock.json ниже сгенерирован
      # npm 12 — более старые npm (10.x) при ЗАПИСИ лока для этого
      # конкретного дерева зависимостей (esbuild нужен в двух разных
      # мажорных версиях — старой через wrangler, новой через vitest/vite)
      # пишут внутренне противоречивый lock (пропускают часть
      # platform-специфичных optionalDependencies для esbuild), который
      # затем сами же `npm ci` отвергают. Баг воспроизвёлся именно так на
      # деплое воркера. npm 12 пишет корректный лок; более старые npm его
      # корректно ЧИТАЮТ (проверено), но писать заново (например, при
      # случайном `npm install` вместо `npm ci`) им доверять нельзя.
      - run: npm install -g npm@12

      - run: npm ci

      - run: npm test

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: deploy
