name: Deploy Worker

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never cancel a running schema change; skip obsolete queued releases by SHA.
    concurrency:
      group: worker-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: worker
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm install -g npm@12
      - run: npm ci
      - name: Check current main before changing schema
        id: current
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [ "$GITHUB_SHA" = "$(git rev-parse origin/main)" ]; then
            echo 'latest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'latest=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping an obsolete release.'
          fi
      - name: Reconcile legacy schema and apply pending D1 migrations
        if: steps.current.outputs.latest == 'true'
        run: npm run migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check current main before deploying
        if: steps.current.outputs.latest == 'true'
        id: release
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [ "$GITHUB_SHA" = "$(git rev-parse origin/main)" ]; then
            echo 'latest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'latest=false' >> "$GITHUB_OUTPUT"
            echo 'Main changed during migration; the next release will deploy.'
          fi
      - name: Deploy to Cloudflare
        if: steps.release.outputs.latest == 'true'
        # Use exactly the Wrangler installed and tested from our lockfile.
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check Worker health
        if: steps.release.outputs.latest == 'true'
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 20 \
            'https://leela-worker.nikita-karpof.workers.dev/api/v1/health' \
            | node --input-type=module -e 'let data=""; for await (const chunk of process.stdin) data+=chunk; const health=JSON.parse(data); if (health.ok!==true || health.db!=="reachable") process.exit(1); console.log("Worker and D1 are reachable");'
