name: Verify and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml
    with:
      upload-pages: true

  worker:
    needs: checks
    uses: ./.github/workflows/deploy-worker.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  pages:
    needs: [checks, worker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      # The old "pages" group holds a job stuck before runner assignment.
      # Use a fresh serial queue; old queued jobs still have the main-SHA guard.
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check current main before publishing
        id: current
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [ "$GITHUB_SHA" = "$(git rev-parse origin/main)" ]; then
            echo 'latest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'latest=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping an obsolete release.'
          fi
      - id: deployment
        if: steps.current.outputs.latest == 'true'
        uses: actions/deploy-pages@v4
